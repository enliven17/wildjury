<!doctype html>
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  /* 1500×500 at 2× = 3000×1000 X header. Left 300px stays clear of the avatar overlap. */
  body { position: relative; }
  .dots { mask-image: linear-gradient(90deg, transparent 0%, #000 40%, #000 60%, transparent 100%); }
  .art { position: absolute; right: 120px; top: 50%; width: 420px; transform: translateY(-50%); filter: drop-shadow(0 0 50px rgba(200, 255, 77, 0.2)); }
  .copy { position: absolute; left: 340px; top: 50%; transform: translateY(-50%); }
  .lockup { height: 40px; margin-bottom: 30px; }
  h1 { font-size: 66px; line-height: 0.98; letter-spacing: -0.05em; font-weight: 500; }
  p { margin-top: 22px; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  
</style>
<div class="dots"></div>
<img class="art" src="../logo/wildjury-mark.svg" alt="" />
<div class="copy">
  <img class="lockup" src="../logo/wildjury-lockup-paper.svg" alt="wildjury" />
  <h1>Put your code<br />on <em>trial</em></h1>
  <p class="mono">A jury of LLMs · one Otari key</p>
</div>
